<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4f1ff"/><stop offset="1" stop-color="#dcf5ea"/></linearGradient>
    <linearGradient id="truckSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9f4f0"/></linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34c77b"/><stop offset="1" stop-color="#1e9e5e"/></linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#f08a12"/></linearGradient>
  </defs>
  <!-- soft background circle -->
  <circle cx="256" cy="262" r="214" fill="url(#bg)"/>
  <!-- map card (like the BOM clipboard) -->
  <g transform="rotate(-6 210 220)">
    <rect x="86" y="88" width="250" height="290" rx="26" fill="#14223d"/>
    <rect x="102" y="104" width="218" height="258" rx="16" fill="#ffffff"/>
    <!-- map blocks -->
    <rect x="118" y="122" width="62" height="44" rx="8" fill="#dbeafe"/>
    <rect x="196" y="122" width="108" height="26" rx="8" fill="#dbeafe"/>
    <rect x="118" y="290" width="70" height="56" rx="8" fill="#dbeafe"/>
    <rect x="230" y="300" width="74" height="46" rx="8" fill="#dbeafe"/>
    <!-- route -->
    <path d="M132 262 C 170 262, 168 196, 214 196 S 262 236, 286 186" fill="none" stroke="#1e9e5e" stroke-width="14" stroke-linecap="round"/>
    <path d="M132 262 C 170 262, 168 196, 214 196 S 262 236, 286 186" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14"/>
    <circle cx="132" cy="262" r="12" fill="#ffffff" stroke="#14223d" stroke-width="6"/>
    <!-- destination pin -->
    <g transform="translate(286 176)">
      <path d="M0 -58 C -26 -58 -42 -40 -42 -18 C -42 10 0 34 0 34 C 0 34 42 10 42 -18 C 42 -40 26 -58 0 -58 Z" fill="url(#pin)" stroke="#ffffff" stroke-width="6"/>
      <circle cx="0" cy="-19" r="14" fill="#ffffff"/>
    </g>
  </g>
  <!-- delivery truck -->
  <g transform="translate(222 270) scale(.9)">
    <ellipse cx="128" cy="164" rx="128" ry="12" fill="#14223d" opacity=".12"/>
    <!-- cargo box -->
    <rect x="0" y="0" width="166" height="118" rx="14" fill="url(#truckSide)" stroke="#14223d" stroke-width="8"/>
    <rect x="18" y="24" width="98" height="14" rx="7" fill="#4aa8ff"/>
    <rect x="18" y="48" width="64" height="12" rx="6" fill="#bfe9d6"/>
    <!-- cab -->
    <path d="M166 36 H 216 C 226 36 232 40 238 48 L 264 84 C 268 90 270 96 270 104 V 128 C 270 136 264 142 256 142 H 166 Z" fill="url(#cab)" stroke="#14223d" stroke-width="8" stroke-linejoin="round"/>
    <path d="M182 54 H 214 C 219 54 222 56 225 60 L 244 86 H 182 Z" fill="#e8fbf2" stroke="#14223d" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-4" y="112" width="178" height="30" rx="8" fill="#14223d"/>
    <!-- wheels -->
    <circle cx="52" cy="146" r="24" fill="#14223d"/><circle cx="52" cy="146" r="10" fill="#ffffff"/>
    <circle cx="218" cy="146" r="24" fill="#14223d"/><circle cx="218" cy="146" r="10" fill="#ffffff"/>
  </g>
  <!-- check badge -->
  <g transform="translate(138 384)">
    <circle r="62" fill="#ffffff"/>
    <circle r="50" fill="#2f80ed"/>
    <path d="M-22 2 L-6 18 L24 -14" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
