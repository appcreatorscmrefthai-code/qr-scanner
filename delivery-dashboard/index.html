<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Plan Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1120;--panel:#131c2e;--panel2:#1a2540;--rule:#26324d;--text:#eaf0fa;--muted:#8e9bb3;
  --blue:#4aa8ff;--amber:#f6b93b;--green:#34d08c;--red:#ff4d61}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;font-size:clamp(13px,min(1.15vw,2.05vh),22px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:clamp(6px,min(1.2vw,1.5vh),22px) clamp(16px,2.2vw,44px);background:linear-gradient(180deg,#1b2742,#141d31);border-bottom:1px solid var(--rule)}
h1{margin:0;font-size:clamp(18px,min(2.3vw,4.2vh),44px)}
.ctl{display:flex;align-items:center;gap:10px}
.ctl h2{margin:0;font-size:1.4em;min-width:9em;text-align:center}
button,.btn{font:inherit;color:var(--text);cursor:pointer;background:var(--panel2);border:1px solid var(--rule);border-radius:8px;
  padding:.3em .9em;text-decoration:none}
button:hover,.btn:hover,button:focus-visible,.btn:focus-visible{border-color:var(--blue);outline:none}
main{flex:1;display:flex;flex-direction:column;padding:clamp(8px,1vw,20px) clamp(16px,2.2vw,44px);min-height:0}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(4px,.5vw,10px)}
.dow{color:var(--muted);font-weight:600;text-align:center;padding-bottom:.4em}
.grid{flex:1;grid-auto-rows:1fr;min-height:0}
.day{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:.4em .6em;display:flex;flex-direction:column;
  color:var(--muted);text-decoration:none;min-height:3.6em;min-width:0}
.day.out{visibility:hidden}
.day .d{font-size:1.25em;font-weight:700;font-variant-numeric:tabular-nums}
a.day{cursor:pointer;--c:var(--blue)}
.day.has{color:var(--text);border-left:4px solid var(--c)}
a.day:hover,a.day:focus-visible{background:var(--panel2);border-color:var(--c);outline:none}
.day.today{box-shadow:0 0 0 2px var(--blue)}
.day .n{margin-top:auto;font-weight:700;font-size:1.05em}
.day .s{font-size:.82em;color:var(--c);font-weight:600}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85em;
  padding:clamp(4px,min(.8vw,1vh),16px) clamp(16px,2.2vw,44px)}
.legend{display:flex;gap:1.2em;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--c);margin-right:.4em}
.banner{background:#4a3a10;color:#ffe2a0;padding:.4em 1em;text-align:center;font-size:.85em}
@media (max-width:760px){html,body{height:auto}.grid{grid-auto-rows:auto}.day{padding:.3em;min-height:4.6em}.day .n{font-size:.9em}.day .s{font-size:.72em}
  .ctl h2{min-width:0}}
</style>
</head>
<body>
<div id="banner" class="banner" hidden>โหมดตัวอย่าง: ยังไม่ได้ใส่ API_URL ใน config.js</div>
<header>
  <h1>Delivery Plan</h1>
  <div class="ctl">
    <button id="prev" aria-label="เดือนก่อน">‹</button><h2 id="title"></h2><button id="next" aria-label="เดือนถัดไป">›</button>
    <button id="thisMonth">เดือนนี้</button>
    <a class="btn" href="dashboard.html">Dashboard วันนี้</a>
    <span id="userBox" style="font-size:.8em;color:var(--muted);white-space:nowrap"></span>
  </div>
</header>
<main>
  <div class="dow"><div>อา.</div><div>จ.</div><div>อ.</div><div>พ.</div><div>พฤ.</div><div>ศ.</div><div>ส.</div></div>
  <div class="grid" id="grid"></div>
</main>
<footer>
  <div class="legend"><span style="--c:var(--green)">จบงานครบ</span><span style="--c:var(--amber)">กำลังดำเนินการ / ยังไม่ถึงวัน</span><span style="--c:var(--red)">ผ่านวันแล้วยังจบงานไม่ครบ</span></div>
  <div id="updated"></div>
</footer>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const CFG = window.APP_CONFIG || {}, DEMO = !CFG.API_URL;
const MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const today = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);   // วันที่ตามเวลาไทย
let month = new URLSearchParams(location.search).get('month') || (DEMO ? '2026-09' : today().slice(0, 7));
let days = {}, seq = 0;

async function load() {
  const my = ++seq;
  draw();
  try {
    let d;
    if (DEMO) d = { ok: true, days: month === '2026-09' ? { '2026-09-29': { total: 4, done: 4 }, '2026-09-30': { total: 6, done: 1 } } : {} };
    else d = await Auth.getJson({ action: 'month', month });
    Auth.badge($('userBox'));
    if (my !== seq) return;
    if (!d.ok) throw new Error(d.error);
    days = d.days || {};
    $('updated').textContent = d.days ? '' : 'ยังไม่แสดงจำนวนงานรายวัน: Apps Script ยังไม่ใช่รุ่นล่าสุด กรุณา Deploy รุ่นใหม่';
    $('updated').style.color = d.days ? '' : 'var(--amber)';
  } catch (e) { if (my !== seq) return; days = {}; $('updated').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message; $('updated').style.color = 'var(--red)'; }
  draw();
}
function draw() {
  const [y, m] = month.split('-').map(Number);
  $('title').textContent = `${MONTHS[m - 1]} ${y}`;
  const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), count = new Date(Date.UTC(y, m, 0)).getUTCDate(), t = today();
  let h = '<div class="day out"></div>'.repeat(first);
  for (let d = 1; d <= count; d++) {
    const date = `${y}-${pad(m)}-${pad(d)}`, x = days[date];
    if (!x) { h += `<a class="day ${date === t ? 'today' : ''}" href="dashboard.html?date=${date}" aria-label="วันที่ ${d}"><span class="d">${d}</span></a>`; continue; }
    const c = x.done >= x.total ? 'green' : date < t ? 'red' : 'amber';
    h += `<a class="day has ${date === t ? 'today' : ''}" style="--c:var(--${c})" href="dashboard.html?date=${date}" aria-label="วันที่ ${d} ${x.total} คัน จบงาน ${x.done}">
      <span class="d">${d}</span><span class="n">${x.total} คัน</span><span class="s">จบงาน ${x.done}/${x.total}</span></a>`;
  }
  $('grid').innerHTML = h;
}
function shift(k) {
  let [y, m] = month.split('-').map(Number); m += k;
  if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
  month = `${y}-${pad(m)}`; days = {}; load();
}
$('prev').onclick = () => shift(-1);
$('next').onclick = () => shift(1);
$('thisMonth').onclick = () => { month = today().slice(0, 7); days = {}; load(); };
if (DEMO) $('banner').hidden = false;
load();
setInterval(load, 5 * 60e3);
</script>
</body>
</html>
