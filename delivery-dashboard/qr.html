<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR เข้าฟอร์มส่งข้อมูล</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font:16px/1.5 "Sarabun","Noto Sans Thai",Tahoma,sans-serif;background:#eef1f6;color:#111827}
.bar{padding:14px;text-align:center}
.bar button{font:inherit;padding:10px 22px;border-radius:10px;border:0;background:#1d4ed8;color:#fff;font-weight:600;cursor:pointer}
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;max-width:900px;margin:0 auto;padding:0 16px 30px}
.card{background:#fff;border:2px solid #111827;border-radius:16px;padding:24px;text-align:center;break-inside:avoid}
.card .no{display:inline-block;background:#111827;color:#fff;border-radius:999px;padding:2px 14px;font-weight:700}
.card h2{margin:10px 0 2px;font-size:26px}
.card p{margin:0 0 14px;color:#4b5563}
.qr{display:inline-block;padding:10px;background:#fff}
.qr img,.qr canvas{display:block;margin:0 auto}
.url{margin-top:12px;font-size:12px;color:#4b5563;word-break:break-all}
@media print{body{background:#fff}.bar{display:none}.sheet{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="bar"><button onclick="window.print()">พิมพ์ QR</button></div>
<div class="sheet">
  <div class="card"><span class="no">ฟอร์ม 1</span><h2>อัปรูปส่งงาน</h2><p>สแกนเมื่อขึ้นของเสร็จ ก่อนรถออก</p>
    <div class="qr" id="q1"></div><div class="url" id="u1"></div></div>
  <div class="card"><span class="no">ฟอร์ม 2</span><h2>อัปเดตสถานการณ์รถบนถนน</h2><p>สแกนระหว่างทาง และเมื่อลงงานเสร็จแต่ละจุด</p>
    <div class="qr" id="q2"></div><div class="url" id="u2"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
// สร้าง QR จากที่อยู่จริงของหน้านี้ จึงใช้ได้ทันทีหลังอัปขึ้น GitHub Pages
const base = location.href.replace(/[^/]*([?#].*)?$/, '');
[['q1', 'u1', 'pickup.html'], ['q2', 'u2', 'road.html']].forEach(([q, u, f]) => {
  const url = base + f;
  document.getElementById(u).textContent = url;
  if (window.QRCode) new QRCode(document.getElementById(q), { text: url, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
  else document.getElementById(q).textContent = 'โหลดตัวสร้าง QR ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ต';
});
</script>
</body>
</html>
