<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR ประจำงาน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* 1 Task Code = 1 หน้า A4 : ครึ่งบน = ผู้จัดส่ง (คนขับ), ครึ่งล่าง = คนโหลด (อัปโหลดรูปส่งงาน) */
@page{size:A4 portrait;margin:10mm}
*{box-sizing:border-box}
body{margin:0;font:12pt/1.4 "Sarabun","Noto Sans Thai",Tahoma,sans-serif;background:#e5e7eb;color:#111827}
.bar{padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;position:sticky;top:0;background:#e5e7eb;z-index:2}
.bar button,.bar a{font:inherit;padding:8px 18px;border-radius:10px;border:0;background:#1d4ed8;color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.bar a{background:#374151}
.datebox{background:#fff;border:1px solid #9ca3af;border-radius:8px;padding:7px 12px;font-weight:600}
#info{text-align:center;color:#374151;padding:0 16px 12px}
#pages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 8px 30px}
.page{width:190mm;height:277mm;background:#fff;display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(0,0,0,.2);padding:0;overflow:hidden}
.half{flex:1 1 0;min-height:0;display:flex;flex-direction:column;padding:6mm 6mm 5mm}
.half + .half{border-top:1.5px dashed #6b7280}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm;border-bottom:2px solid #111827;padding-bottom:2mm}
.role{font-size:20pt;font-weight:700;line-height:1.15}
.role small{display:block;font-size:11pt;font-weight:400;color:#374151}
.code{text-align:right;font-size:17pt;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.code small{display:block;font-size:10.5pt;font-weight:400;color:#374151}
.meta{font-size:10.5pt;color:#1f2937;margin-top:2mm;overflow-wrap:anywhere;max-height:17mm;overflow:hidden}
.body{flex:1;min-height:0;display:grid;grid-template-columns:72mm 1fr;gap:6mm;margin-top:3mm}
.qrcol{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.qr img,.qr canvas{width:66mm;height:66mm;display:block}
.qrcol .hint{font-size:10pt;color:#374151;margin-top:1.5mm}
.help{border:1.2px solid #9ca3af;border-radius:3mm;padding:3mm 4mm;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.help b{font-size:12pt}
.help ol{margin:1.5mm 0 0;padding:0;list-style:none;font-size:11.5pt}
.help li{margin-bottom:1mm}
@media screen and (max-width:760px){#pages{zoom:.48}}
@media print{
  body{background:#fff}
  .bar,#info{display:none}
  #pages{display:block;padding:0}
  .page{box-shadow:none;break-after:page;page-break-after:always;margin:0}
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="bar">
  <span>วันที่</span><input type="date" id="date" class="datebox" aria-label="เลือกวันที่">
  <button id="printBtn" disabled>พิมพ์ QR</button>
  <a href="dashboard.html" id="back">กลับ Dashboard</a>
</div>
<div id="info"></div>
<div id="pages"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
// QR ประจำงาน: สแกนด้วยกล้องมือถือแล้วเข้าหน้าของงานนั้นทันที
const CFG = window.APP_CONFIG || {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const base = location.href.replace(/[^/]*([?#].*)?$/, '');
const today = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
let date = new URLSearchParams(location.search).get('date') || today();

const HALVES = [
  { key: 'b', file: 'road.html', role: 'สำหรับผู้จัดส่ง', sub: 'คนขับ / คนติดตาม : เช็คอิน, สถานการณ์บนถนน, ส่งงาน', help: CFG.QR_HELP_DRIVER },
  { key: 'a', file: 'pickup.html', role: 'สำหรับคนโหลด', sub: 'อัปโหลดรูปส่งงานก่อนรถออกจากต้นทาง', help: CFG.QR_HELP_LOADER }
];

async function load() {
  $('date').value = date; DateBox.sync($('date')); $('back').href = 'dashboard.html?date=' + date;
  $('info').textContent = 'กำลังโหลด…'; $('pages').innerHTML = ''; $('printBtn').disabled = true;
  let tasks;
  try {
    if (!CFG.API_URL) tasks = ['D20261003-01', 'D20261003-02'].map(c => ({ taskCode: c, pickup: '07:30', plate: '3 ฒผ 2186', vehicleType: '4ล้อเทลเกต(จัมโบ้)', driver: '(โหมดตัวอย่าง)', phone: '080-0000000', round: 'รอบเดียว', stops: [{ name: 'จุดส่งตัวอย่าง 1', arrival: '09:00' }, { name: 'จุดส่งตัวอย่าง 2', arrival: '10:00' }] }));
    else { const d = await Auth.getJson({ action: 'plan', date }); if (!d.ok) throw new Error(d.error); tasks = d.tasks; }
  } catch (e) { $('info').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message; return; }
  if (!window.QRCode) { $('info').textContent = 'โหลดตัวสร้าง QR ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วเปิดหน้านี้ใหม่'; return; }
  tasks.sort((a, b) => a.taskCode.localeCompare(b.taskCode));
  $('info').textContent = tasks.length ? `${tasks.length} งาน = ${tasks.length} หน้า (A4 แนวตั้ง) · 1 หน้าต่อ 1 Task Code` : 'ไม่มีแผนจัดส่งของวันที่เลือก';
  tasks.forEach((t, i) => {
    const meta = `${esc([t.pickup ? 'ตารางเวลา ' + t.pickup + ' น.' : '', t.round, t.vehicleType, t.plate ? 'ทะเบียน ' + t.plate : ''].filter(Boolean).join(' · '))}<br>
      ${esc([t.driver ? 'ผู้ขับ ' + t.driver : '', t.phone].filter(Boolean).join(' '))}${t.driver || t.phone ? '<br>' : ''}
      ${esc((t.stops || []).map((s, k) => `${k + 1}) ${s.name}${s.arrival ? ' (' + s.arrival + ')' : ''}`).join('  '))}`;
    const page = document.createElement('section'); page.className = 'page';
    page.innerHTML = HALVES.map(h => `<div class="half">
        <div class="head"><div class="role">${h.role}<small>${h.sub}</small></div>
          <div class="code">${esc(t.taskCode)}<small>${esc(DateBox.text(t.date || date))}</small></div></div>
        <div class="meta">${meta}</div>
        <div class="body">
          <div class="qrcol"><div class="qr" id="${h.key}${i}"></div><div class="hint">สแกนด้วยกล้องมือถือ</div></div>
          <div class="help"><b>วิธีใช้งาน</b>${Array.isArray(h.help) && h.help.length ? `<ol>${h.help.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}</div>
        </div></div>`).join('');
    $('pages').appendChild(page);
    HALVES.forEach(h => new QRCode($(h.key + i), { text: `${base}${h.file}?task=${encodeURIComponent(t.taskCode)}`, width: 360, height: 360, correctLevel: QRCode.CorrectLevel.M }));
  });
  $('printBtn').disabled = !tasks.length;
}
DateBox.attach($('date'));
$('date').onchange = e => { date = e.target.value || today(); load(); };
$('printBtn').onclick = () => window.print();
load();
</script>
</body>
</html>
