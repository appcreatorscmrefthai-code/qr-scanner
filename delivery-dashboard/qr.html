<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>พิมพ์ QR - Delivery Tracking</title>
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<style>
/* รูปแบบตามไฟล์ QR_Forms_Sample_2.docx : ฟอนต์ Tahoma ขอบกระดาษ 10 มม.
   รายงานคนขับ    : 1 งาน = 1 หน้า A4 ตัดได้ 4 ชิ้น (ส่วนหัว + จุดส่ง 3 ช่อง)
   รายงาน WH / QA  : 3 งาน = 1 หน้า A4 ตัดได้ 3 ชิ้น (QR ซ้าย = WH คลังสินค้า, QR ขวา = QA ประกันคุณภาพ)
   ขอบ @page = 0 เพื่อไม่ให้เบราว์เซอร์พิมพ์ชื่อหน้า/ที่อยู่เว็บ แล้วพิมพ์เฉพาะวันที่ (บนซ้าย) กับเลขหน้า (ล่างขวา) เอง */
@page{size:A4 portrait;margin:0}
*{box-sizing:border-box}
body{margin:0;font:11pt/1.5 Tahoma,"Leelawadee UI","Noto Sans Thai",sans-serif;background:#e5e7eb;color:#000}
.bar{padding:12px 16px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;justify-content:center;position:sticky;top:0;background:#e5e7eb;z-index:2}
.bar button,.bar a{font:inherit;padding:8px 18px;border-radius:10px;border:0;background:#1d4ed8;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.bar button:disabled{opacity:.45;cursor:not-allowed}
.bar a{background:#374151}
.datebox{background:#fff;border:1px solid #9ca3af;border-radius:8px;padding:7px 12px;font-weight:700}
.kind{display:flex;border:1px solid #9ca3af;border-radius:10px;overflow:hidden;background:#fff}
.kind label{padding:7px 14px;cursor:pointer;font-weight:700;border-right:1px solid #d1d5db}
.kind label:last-child{border-right:0}
.kind input{position:absolute;opacity:0;pointer-events:none}
.kind label:has(input:checked){background:#111827;color:#fff}
.kind label:has(input:focus-visible){outline:2px solid #1d4ed8;outline-offset:-2px}
#info{text-align:center;color:#374151;padding:0 16px 12px}
#pages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 8px 30px}
.page{position:relative;width:210mm;height:297mm;padding:10mm;background:#fff;display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(0,0,0,.2);overflow:hidden}
.pg-date,.pg-no{position:absolute;font-size:8pt;line-height:1;color:#000;font-variant-numeric:tabular-nums}
.pg-date{left:10mm;top:4.5mm}
.pg-no{right:10mm;bottom:4.5mm}
.piece{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.piece + .piece{border-top:1px dashed #000}          /* เส้นประ = แนวตัด */
u{text-underline-offset:1.5pt}

/* ---- ส่วนหัว (ใช้ทั้งสองรายงาน) ---- */
.head{display:grid;grid-template-columns:1fr auto;column-gap:6mm;align-items:start;border-bottom:1.5pt solid #000;padding-bottom:1.5mm}
.role{font-size:18pt;font-weight:700;line-height:1.3}
.role small{display:block;font-size:10pt;font-weight:400;color:#374151;line-height:1.5;max-width:92mm}
.ref{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ref b{display:block;font-size:18pt;line-height:1.3}
.ref strong{display:block;font-size:14pt;line-height:1.35}
.ref span{display:block;font-size:12pt;color:#374151;line-height:1.35}
.big{font-size:14pt;font-weight:700;line-height:1.45;margin-top:2mm;overflow-wrap:anywhere}
.lbl{font-size:11pt;font-weight:700}
.txt{font-size:11pt;overflow-wrap:anywhere}
.qr img,.qr canvas{width:var(--q);height:var(--q);display:block}

/* ---- รายงานคนขับ : 4 ชิ้น ---- */
.drv-main{flex:1 1 0;padding:0 0 3mm;--q:24.3mm}
.drv-main .cols{display:grid;grid-template-columns:1fr 1fr;column-gap:4mm;margin-top:1mm;align-items:start}
.drv-main .stop + .stop{margin-top:3.5mm}                     /* เว้นบรรทัดระหว่างจุดส่ง */
.drv-main .qrrow{display:flex;gap:4mm;align-items:flex-start}
.help b{display:block;font-size:11pt}
.help div{font-size:10.5pt}
/* ส่วนหัวข้อมูลเยอะ (จุดส่งหลายจุด/ชื่อยาว) : ย่อทีละขั้นจนพอดีชิ้นบน — fitMain() */
.drv-main.f1 .big{font-size:13pt;line-height:1.35;margin-top:1mm}.drv-main.f1 .txt{font-size:10pt;line-height:1.4}.drv-main.f1 .stop + .stop{margin-top:1.5mm}.drv-main.f1 .role small{font-size:9pt;line-height:1.35}
.drv-main.f2 .rv{display:none}
.drv-main.f3 .ap br{display:none}.drv-main.f3 .txt{font-size:9.5pt}
.drv-stop{flex:0 0 64mm;display:grid;grid-template-columns:51mm minmax(0,1fr);column-gap:11mm;align-content:start;padding:3mm 0 2mm;--r:5.4mm}   /* 3 ชิ้นล่างสูงเท่ากันเสมอ แนวตัดตรงกันทุกหน้า */
.drv-stop .name{grid-column:1 / -1;font-size:12pt;font-weight:700;line-height:1.35;max-height:2.7em;overflow:hidden;overflow-wrap:anywhere;margin-bottom:1.5mm}
.drv-stop .info{display:flex;flex-direction:column;min-width:0;font-size:11pt}   /* แต่ละบรรทัดตรงกับแถวตาราง */
.drv-stop .info > div{height:var(--r);line-height:var(--r);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drv-stop .info .k{font-size:12pt;font-weight:700}
.drv-stop .info .ln{font-size:14pt;font-weight:700}
.drv-stop .info .no{margin-top:1.5mm;height:7mm;line-height:6.4mm;align-self:flex-start;font-size:14pt;font-weight:700;border:1.5pt solid #000;padding:0 3mm}
table.docs{border-collapse:collapse;width:100%;table-layout:fixed;font-size:10pt;line-height:1.2}
table.docs th,table.docs td{border:1px solid #000;padding:0 1.5mm;height:var(--r);white-space:nowrap;overflow:hidden}
table.docs th{font-weight:700;text-align:center}
table.docs col.c{width:23%}
table.docs td.c{text-align:center;font-size:11pt;line-height:1}
.drv-stop .rmk{margin-top:1.5mm;height:7mm;border:1px solid #000;padding:.4mm 1.5mm;font-size:10pt;font-weight:700}

/* ---- รายงาน WH / QA : 3 ชิ้น  [QR WH] [ข้อมูลงาน] [QR QA] ---- */
.wh{flex:1 1 0;--q:29.9mm}
.wh + .wh{padding-top:4mm}
.wh .ref strong,.wh .ref span{display:inline}.wh .ref span{margin-left:2.5mm}     /* Task Code กับวันที่อยู่บรรทัดเดียวกัน */
.wh .cols{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:6mm;align-items:start;margin-top:1.5mm}
.wh figure{margin:1mm 0 0;text-align:center}
.wh figcaption{font-size:12pt;font-weight:700;line-height:1.3;margin-top:.5mm}
.wh.f1 .txt{font-size:10pt;line-height:1.4}
/* งานต่างประเทศ : เลข Client ยาว (เช่น CL26000100) จึงลดขนาดตัวอักษรส่วนหัว */
.role .intl{color:#dc2626}
.wh.x .role{font-size:16pt}.wh.x .ref b{font-size:15pt}.wh.x .ref strong{font-size:13pt}
.head.sm .ref b{font-size:13pt}.head.sm .ref strong{font-size:12pt}.head.sm .role{font-size:15pt}.wh.f1 .big{font-size:13pt;margin-top:1mm}

@media screen and (max-width:760px){#pages{zoom:.48}}
@media print{
  body{background:#fff}
  .bar,#info{display:none}
  #pages{display:block;padding:0}
  .page{box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="bar">
  <span>วันที่</span><input type="date" id="date" class="datebox" aria-label="เลือกวันที่">
  <div class="kind" role="radiogroup" aria-label="ชนิดฟอร์ม">
    <label><input type="radio" name="kind" value="driver" checked>รายงานคนขับ</label>
    <label><input type="radio" name="kind" value="wh">รายงาน WH / QA</label>
    <label><input type="radio" name="kind" value="whx">รายงาน WH / QA ต่างประเทศ</label>
    <label><input type="radio" name="kind" value="both">ทุกรายงาน</label>
  </div>
  <button id="printBtn" disabled>พิมพ์</button>
  <a href="dashboard.html" id="back">กลับหน้าติดตามการจัดส่ง</a>
</div>
<div id="info"></div>
<div id="pages"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="config.js?v=22"></script>
<script src="api.js?v=22"></script>
<script src="auth.js?v=22"></script>
<script>
// QR ประจำงาน: สแกนแล้วเข้าหน้าของงานนั้นทันที  1 งานมี 2 รายงาน (คนขับ / WH และ QA) เลือกชนิดก่อนพิมพ์
const CFG = window.APP_CONFIG || {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const base = location.href.replace(/[^/]*([?#].*)?$/, '');
const today = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
const ORIGIN = CFG.ORIGIN || 'SCM';
const DOCS = Array.isArray(CFG.QR_DOCS) && CFG.QR_DOCS.length ? CFG.QR_DOCS : ['PACKING SLIP / DELIVERY ORDER', 'TAX INVOICE ________________', 'BILLING NOTE', 'RECEIPT', 'PO. CUSTOMER', 'ใบส่งสินค้าชั่วคราว'];
const join = a => a.filter(Boolean).map(esc).join(' | ');
let date = new URLSearchParams(location.search).get('date') || today(), tasks = [], seq = 0, pending = [];
const kind = () => document.querySelector('input[name=kind]:checked').value;

// ส่วนหัว: ซ้าย = ชื่อรายงาน, ขวา = เวลานัด | LN Num, Task Code, วันที่
const head = (role, sub, t) => `<div class="head"><div class="role">${role}<small>${sub}</small></div>
  <div class="ref"><b>${join([t.pickup ? 'เวลานัด ' + t.pickup + ' น.' : '', t.client])}</b><strong>${esc(t.taskCode)}</strong><span>${esc(DateBox.text(t.date || date))}</span></div></div>`;
const qrBox = (file, t) => { const id = 'qr' + (++seq); pending.push([id, `${base}${file}?task=${encodeURIComponent(t.taskCode)}`]); return `<div class="qr" id="${id}"></div>`; };
// หน้า A4: วันที่พิมพ์ (บนซ้าย) และเลขหน้า (ล่างขวา) พิมพ์เอง แทนหัว/ท้ายกระดาษของเบราว์เซอร์
const sheet = inner => `<section class="page"><div class="pg-date"></div>${inner}<div class="pg-no"></div></section>`;
function stampPages() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const text = `${DateBox.text(`${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`)} ${p(d.getHours())}:${p(d.getMinutes())}`;
  const all = document.querySelectorAll('.page');
  all.forEach((pg, i) => { pg.querySelector('.pg-date').textContent = text; pg.querySelector('.pg-no').textContent = `${i + 1}/${all.length}`; });
}

// รายงานที่ 1 : คนขับ / คนติดตาม  1 งานต่อ 1 หน้า แบ่ง 4 ชิ้นตามเส้นประ (ส่วนหัว + จุดส่ง 3 ช่อง)
function driverPage(t) {
  const stops = (t.stops || []).slice(0, 3);
  const docs = `<table class="docs"><colgroup><col class="c"><col class="c"><col></colgroup><tr><th>ให้ลูกค้าเซ็น</th><th>ส่งคืน ${esc(ORIGIN)}</th><th>เอกสาร</th></tr>
    ${DOCS.map(d => `<tr><td class="c">☐</td><td class="c">☐</td><td>${esc(d)}</td></tr>`).join('')}</table>`;
  const line = (s, k) => `${k + 1}) ${esc(s.name)}${s.arrival ? ` (เวลานัด ${esc(s.arrival)})` : ''}`;
  // ส่วนหัว: จุดส่งละ 2 บรรทัด (ชื่อจุดส่ง / เวลานัด + ผู้รับ ขีดเส้นใต้)
  const stop = (s, k) => `<div class="txt stop">${k + 1}) ${esc(s.name)}<span class="ap"><br> เวลานัด : <u>${esc(s.arrival || '-')}</u></span>${s.receiver ? `<span class="rv"> &nbsp; ผู้รับ : <u>${esc(s.receiver)}</u></span>` : ''}</div>`;
  const help = Array.isArray(CFG.QR_HELP_DRIVER) && CFG.QR_HELP_DRIVER.length ? `<div class="help"><b>วิธีใช้</b>${CFG.QR_HELP_DRIVER.map(x => `<div>${esc(x)}</div>`).join('')}</div>` : '';
  const dmy = String(t.date || date).split('-').reverse().join('/');          // 14/10/2026
  const u = v => v ? `<u>${esc(v)}</u>` : '______';
  // ชิ้นจุดส่ง: ซ้าย = ข้อมูลงาน (บรรทัดตรงกับแถวตาราง), ขวา = ตารางเอกสาร + หมายเหตุ
  const slot = k => stops[k] ? `<div class="piece drv-stop"><div class="name">${line(stops[k], k)}</div>
      <div class="info"><div class="k">วันที่ ${esc(dmy)}</div><div class="k">เวลารับของ ${u(t.pickup)} น.</div><div class="k">ทะเบียน ${u(t.plate)}</div>
        <div>${esc(t.taskCode)}</div><div>ผู้รับ :</div><div>${esc(stops[k].receiver || '-')}</div><div class="ln">${esc(t.client || '')}</div>
        <div class="no">จุดส่งที่ ${k + 1}</div></div>
      <div class="rt">${docs}<div class="rmk">หมายเหตุ :</div></div></div>`
    : '<div class="piece drv-stop"></div>';
  return sheet(`
    <div class="piece drv-main">
      ${head('สำหรับคนขับ / คนติดตาม', 'ใช้สำหรับ : เช็คอินเข้ารับของ, อัปเดตสถานการณ์บนถนน, อัปเดตข้อมูลส่งงาน', t)}
      <div class="big">${join([t.round ? 'ส่ง : ' + t.round : '', t.vehicleType ? 'รถ : ' + t.vehicleType : '', t.plate ? 'ทะเบียน : ' + t.plate : ''])}</div>
      <div class="big" style="margin-top:.5mm">${(t.driver || t.phone) ? 'ผู้ขับ : ' + esc([t.driver, t.phone].filter(Boolean).join(' ')) : ''}</div>
      <div class="cols">
        <div><div class="lbl">จุดส่ง</div>${stops.map(stop).join('')}
          ${t.roundTrip ? `<div class="txt stop">↩ กลับ ${esc(ORIGIN)} (รอบไป-กลับ) กด "รถกลับถึง ${esc(ORIGIN)}" เพื่อจบงาน</div>` : ''}</div>
        <div class="qrrow">${qrBox('road.html', t)}${help}</div>
      </div>
    </div>
    ${slot(0)}${slot(1)}${slot(2)}`);
}

// รายงานที่ 2 : WH และ QA  งานละ 1/3 หน้า (1 หน้าตัดได้ 3 ชิ้น) QR ซ้าย = WH (pickup.html), QR ขวา = QA (qa.html)
function whPiece(t) {
  if (!t) return '<div class="piece wh"></div>';
  const x = isIntl(t);          // งานต่างประเทศ : QR ชุดเดิม (หน้าฟอร์มเปลี่ยนเป็นโหมดต่างประเทศเองตามประเภทรถ)
  return `<div class="piece wh${x ? ' x' : ''}">
    ${x ? head('สำหรับ WH และ QA <span class="intl">ต่างประเทศ</span>', 'อัปโหลดรูปส่งงาน · WH บันทึกรถเข้า-รถออก', t)
        : head('สำหรับ WH และ QA', `อัปโหลดรูปส่งงานหลังรถออกจาก ${esc(ORIGIN)} ทันที`, t)}
    <div class="big">${join([t.vehicleType, t.plate ? 'ทะเบียน ' + t.plate : '', t.driver ? 'ผู้ขับ ' + t.driver : ''])}</div>
    <div class="cols">
      <figure>${qrBox('pickup.html', t)}<figcaption>WH</figcaption></figure>
      <div>
        <div class="txt">บริษัทขนส่ง : ${esc(t.company || '-')}</div>
        <div class="txt"><u>หมายเหตุ : ${esc(t.transport || '-')}</u></div>
        <div class="lbl" style="margin-top:1.5mm">จุดส่ง</div>
        ${(t.stops || []).slice(0, 3).map((s, k) => `<div class="txt">${k + 1}) ${esc(s.name)}${s.arrival ? ` <u>(เวลาถึงหน้างาน ${esc(s.arrival)})</u>` : ''}</div>`).join('')}
      </div>
      <figure>${qrBox('qa.html', t)}<figcaption>QA</figcaption></figure>
    </div>
  </div>`;
}

// งานต่างประเทศ (CL 20FT / CL 40FT / CL 40HC / LCL / DHL) ไม่มีรายงานคนขับ และแยกรายงาน WH / QA ต่างประเทศ
const isIntl = t => !!t.intl;
function draw() {
  const k = kind(); pending = []; let html = '', pages = 0;
  const dom = tasks.filter(t => !isIntl(t)), intl = tasks.filter(isIntl);
  const wh3 = list => { for (let i = 0; i < list.length; i += 3) { html += sheet(whPiece(list[i]) + whPiece(list[i + 1]) + whPiece(list[i + 2])); pages++; } };
  if (k === 'driver' || k === 'both') { html += dom.map(driverPage).join(''); pages += dom.length; }
  if (k === 'wh' || k === 'both') wh3(dom);
  if (k === 'whx' || k === 'both') wh3(intl);
  const n = k === 'whx' ? intl.length : k === 'both' ? tasks.length : dom.length;
  $('pages').innerHTML = html;
  pending.forEach(([id, text]) => new QRCode($(id), { text, width: 360, height: 360, correctLevel: QRCode.CorrectLevel.M }));
  stampPages(); fitMain();
  const name = { driver: 'รายงานคนขับ (1 งานต่อหน้า ตัด 4 ชิ้น)', wh: 'รายงาน WH / QA (3 งานต่อหน้า ตัด 3 ชิ้น)', whx: 'รายงาน WH / QA ต่างประเทศ (3 งานต่อหน้า ตัด 3 ชิ้น)', both: 'ทุกรายงาน' }[k];
  $('info').textContent = !tasks.length ? 'ไม่มีแผนจัดส่งของวันที่เลือก'
    : n ? `${n} งาน · ${name} · ${pages} หน้า A4 แนวตั้ง` + (k !== 'whx' && intl.length && k !== 'both' ? ` · มีงานต่างประเทศอีก ${intl.length} งาน (เลือก “รายงาน WH / QA ต่างประเทศ”)` : '')
    : k === 'whx' ? 'ไม่มีงานต่างประเทศของวันที่เลือก' : `ไม่มีงานในประเทศของวันที่เลือก (มีงานต่างประเทศ ${intl.length} งาน)`;
  $('printBtn').disabled = !pages; $('printBtn').textContent = 'พิมพ์' + ({ driver: 'รายงานคนขับ', wh: 'รายงาน WH / QA', whx: 'รายงาน WH / QA ต่างประเทศ', both: 'ทุกรายงาน' }[k]);
}
// ชิ้นบนของรายงานคนขับต้องจบในชิ้นเดียว : ถ้าล้นให้ย่อทีละขั้น (f1 ตัวเล็กลง → f2 ซ่อนผู้รับ (มีในชิ้นจุดส่งแล้ว) → f3 เวลานัดต่อท้ายบรรทัด)
function fitMain() {
  document.querySelectorAll('.drv-main').forEach(m => {
    m.classList.remove('f1', 'f2', 'f3');
    for (let i = 1; i <= 3 && m.scrollHeight > m.clientHeight + 1; i++) m.classList.add('f' + i);
  });
  document.querySelectorAll('.wh').forEach(m => { m.classList.remove('f1'); if (m.scrollHeight > m.clientHeight + 1) m.classList.add('f1'); });
  document.querySelectorAll('.head').forEach(h => { h.classList.remove('sm'); if (h.scrollWidth > h.clientWidth + 1) h.classList.add('sm'); });   // หัวกระดาษยาวเกิน : ลดตัวอักษร   // ชิ้น WH/QA ข้อมูลเยอะ : ตัวเล็กลง
}
if (document.fonts) document.fonts.ready.then(fitMain);
window.addEventListener('beforeprint', stampPages);
window.addEventListener('beforeprint', fitMain);
// ชื่อไฟล์ตอนบันทึกเป็น PDF = ชื่อหน้า (title) ขณะสั่งพิมพ์ : QR คนขับ / QR WH และ QA / QR รวม + วันที่เวลาที่พิมพ์ เช่น QR คนขับ 20261013 1551
const baseTitle = document.title;
function printTitle() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${{ driver: 'QR คนขับ', wh: 'QR WH และ QA', whx: 'QR WH และ QA ต่างประเทศ', both: 'QR รวม' }[kind()]} ${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())} ${p(d.getHours())}${p(d.getMinutes())}`;
}
window.addEventListener('beforeprint', () => { document.title = printTitle(); });
window.addEventListener('afterprint', () => { document.title = baseTitle; });

async function load() {
  $('date').value = date; DateBox.sync($('date')); $('back').href = 'dashboard.html?date=' + date;
  $('info').textContent = 'กำลังโหลด…'; $('pages').innerHTML = ''; $('printBtn').disabled = true; tasks = [];
  try {
    if (!SB.ON) tasks = [1, 2, 3].map(i => ({ taskCode: 'D20261003-0' + i, date: '2026-10-03', pickup: ['07:30', '08:00', '08:30'][i - 1], client: 'LN26-55' + (3 - i), company: 'บริษัท ปทุม ทรานสปอร์ต จำกัด', transport: 'min : 4W 1.85 x 3.43 x 1.89 mm 2ฒผ-2186 (07.50 น ต้องปล่อยรถ)', plate: '3 ฒผ 2186', vehicleType: '4ล้อเทลเกต(จัมโบ้)', driver: 'กิตติศักดิ์ มะลิเลย', phone: '092-8322384', round: i === 3 ? 'ไป-กลับ' : 'รอบเดียว', roundTrip: i === 3,
      stops: [{ name: '7-11 พหลโยธิน 55/2 วงเวียนขางเขน #24145', arrival: '09:00', receiver: 'ติดต่อ 091-876-6497 คุณจ๋า' }, { name: '7-11 ลำลูกกา 36 #24267', arrival: '10:00', receiver: 'โปรดดูข้อมูลในใบแพลน' }, { name: '7-11 ลำลูกกา 51', arrival: '10:30', receiver: '' }].slice(0, [2, 3, 1][i - 1]) }));
    else { const d = await Auth.getJson({ action: 'plan', date }); if (!d.ok) throw new Error(d.error); tasks = d.tasks.filter(t => !t.canceled); }
  } catch (e) { $('info').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message; return; }
  if (!window.QRCode) { $('info').textContent = 'โหลดตัวสร้าง QR ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วเปิดหน้านี้ใหม่'; return; }
  tasks.sort((a, b) => a.taskCode.localeCompare(b.taskCode));
  draw();
}
DateBox.attach($('date'));
$('date').onchange = e => { date = e.target.value || today(); load(); };
document.querySelectorAll('input[name=kind]').forEach(r => { r.onchange = draw; });
$('printBtn').onclick = () => window.print();
load();
</script>
</body>
