<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ฟอร์ม QR ประจำงาน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* รายงานคนขับ: 1 งาน = 1 หน้า A4   รายงานคลังสินค้า: 2 งาน = 1 หน้า A4 (งานละครึ่งหน้า) */
@page{size:A4 portrait;margin:10mm}
*{box-sizing:border-box}
body{margin:0;font:11pt/1.4 "Sarabun","Noto Sans Thai",Tahoma,sans-serif;background:#e5e7eb;color:#111827}
.bar{padding:12px 16px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;justify-content:center;position:sticky;top:0;background:#e5e7eb;z-index:2}
.bar button,.bar a{font:inherit;padding:8px 18px;border-radius:10px;border:0;background:#1d4ed8;color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.bar button:disabled{opacity:.45;cursor:not-allowed}
.bar a{background:#374151}
.datebox{background:#fff;border:1px solid #9ca3af;border-radius:8px;padding:7px 12px;font-weight:600}
.kind{display:flex;border:1px solid #9ca3af;border-radius:10px;overflow:hidden;background:#fff}
.kind label{padding:7px 14px;cursor:pointer;font-weight:600;border-right:1px solid #d1d5db}
.kind label:last-child{border-right:0}
.kind input{position:absolute;opacity:0;pointer-events:none}
.kind label:has(input:checked){background:#111827;color:#fff}
.kind label:has(input:focus-visible){outline:2px solid #1d4ed8;outline-offset:-2px}
#info{text-align:center;color:#374151;padding:0 16px 12px}
#pages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 8px 30px}
.page{width:190mm;height:277mm;background:#fff;display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(0,0,0,.2);overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm;border-bottom:2px solid #111827;padding-bottom:2mm}
.role{font-size:19pt;font-weight:700;line-height:1.15}
.role small{display:block;font-size:10.5pt;font-weight:400;color:#374151;margin-top:1mm}
.code{text-align:right;font-size:17pt;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.code small{display:block;font-size:10.5pt;font-weight:400;color:#374151}
.strong{font-weight:700;font-size:11.5pt;margin-top:2mm;overflow-wrap:anywhere}
.line{margin-top:.6mm;overflow-wrap:anywhere}
.qrrow{display:flex;gap:8mm;align-items:flex-start;margin-top:4mm}
.qrbox{text-align:center;flex:none}
.qr img,.qr canvas{width:var(--q);height:var(--q);display:block}
.qrbox .hint{font-size:9.5pt;color:#374151;margin-top:1mm}
.help b{display:block;font-size:11pt}
.help div{font-size:10.5pt;color:#1f2937}
/* ---- คนขับ ---- */
.drv{padding:5mm 6mm;--q:40mm}
.drv h3{margin:4mm 0 0;font-size:11pt}
.stop{margin-top:2.5mm;break-inside:avoid}
.stop p{margin:0 0 1.2mm;font-size:10.5pt;overflow-wrap:anywhere}
table.docs{border-collapse:collapse;width:96mm;font-size:8.5pt}
table.docs th,table.docs td{border:1px solid #111827;padding:0 2mm;height:5.2mm}
table.docs th{font-weight:700;text-align:center}
table.docs td.c{width:21mm;text-align:center}
table.docs td.c i{display:inline-block;width:3.6mm;height:3.6mm;border:1px solid #111827;vertical-align:middle}
/* ---- คลังสินค้า ---- */
.wh{flex:1 1 0;min-height:0;padding:6mm;--q:44mm;overflow:hidden}
.wh + .wh{border-top:1.5px dashed #6b7280}
.wh .strong{font-size:10.5pt}
.wh .stops{margin-top:2.5mm}
@media screen and (max-width:760px){#pages{zoom:.48}}
@media print{
  body{background:#fff}
  .bar,#info{display:none}
  #pages{display:block;padding:0}
  .page{box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="bar">
  <span>วันที่</span><input type="date" id="date" class="datebox" aria-label="เลือกวันที่">
  <div class="kind" role="radiogroup" aria-label="ชนิดฟอร์ม">
    <label><input type="radio" name="kind" value="driver" checked>รายงานคนขับ</label>
    <label><input type="radio" name="kind" value="wh">รายงานคลังสินค้า</label>
    <label><input type="radio" name="kind" value="both">ทั้ง 2 รายงาน</label>
  </div>
  <button id="printBtn" disabled>พิมพ์</button>
  <a href="dashboard.html" id="back">กลับ Dashboard</a>
</div>
<div id="info"></div>
<div id="pages"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
// QR ประจำงาน: สแกนแล้วเข้าหน้าของงานนั้นทันที  1 งานมี 2 รายงาน (คนขับ / คลังสินค้า) เลือกชนิดก่อนพิมพ์
const CFG = window.APP_CONFIG || {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const base = location.href.replace(/[^/]*([?#].*)?$/, '');
const today = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
const DOCS = Array.isArray(CFG.QR_DOCS) && CFG.QR_DOCS.length ? CFG.QR_DOCS : ['PACKING SLIP / DELIVERY ORDER', 'TAX INVOICE ________________', 'BILLING NOTE', 'RECEIPT', 'PO. CUSTOMER', 'ใบส่งสินค้าชั่วคราว'];
const join = a => a.filter(Boolean).map(esc).join(' | ');
let date = new URLSearchParams(location.search).get('date') || today(), tasks = [], seq = 0;
const kind = () => document.querySelector('input[name=kind]:checked').value;

const head = (role, sub, t) => `<div class="head"><div class="role">${role}<small>${sub}</small></div>
  <div class="code">${esc(t.taskCode)}<small>${esc(DateBox.text(t.date || date))}</small></div></div>`;
const help = (title, lines) => Array.isArray(lines) && lines.length ? `<div class="help"><b>${title}</b>${lines.map(x => `<div>${esc(x)}</div>`).join('')}</div>` : '';
const qrBox = (file, t, hint) => { const id = 'qr' + (++seq); pending.push([id, `${base}${file}?task=${encodeURIComponent(t.taskCode)}`]); return `<div class="qrbox"><div class="qr" id="${id}"></div><div class="hint">${hint}</div></div>`; };
let pending = [];

// รายงานที่ 1 : คนขับ / คนติดตาม (1 งานต่อ 1 หน้า) มีตารางเอกสารของแต่ละจุดส่ง
function driverPage(t) {
  const docs = `<table class="docs"><tr><th>ให้ลูกค้าเซ็น</th><th>ส่งคืน ${esc(CFG.ORIGIN || 'SCM')}</th><th>เอกสาร</th></tr>
    ${DOCS.map(d => `<tr><td class="c"><i></i></td><td class="c"><i></i></td><td>${esc(d)}</td></tr>`).join('')}</table>`;
  return `<section class="page"><div class="drv">
    ${head('สำหรับคนขับ / คนติดตาม', 'ใช้สำหรับ : เช็คอินเข้ารับของ, อัปเดตสถานการณ์บนถนน, อัปเดตข้อมูลส่งงาน', t)}
    <div class="strong">${join([t.pickup ? 'ตารางเวลา ' + t.pickup + ' น.' : '', t.round ? 'ส่ง : ' + t.round : '', t.vehicleType ? 'รถ : ' + t.vehicleType : ''])}</div>
    <div class="strong">${join([t.plate ? 'ทะเบียน : ' + t.plate : '', (t.driver || t.phone) ? 'ผู้ขับ : ' + [t.driver, t.phone].filter(Boolean).join(' ') : ''])}</div>
    <div class="qrrow">${qrBox('road.html', t, 'สแกนด้วย Line หรือกล้องมือถือ')}${help('วิธีใช้', CFG.QR_HELP_DRIVER)}</div>
    <h3>จุดส่ง</h3>
    ${(t.stops || []).map((s, k) => `<div class="stop"><p>${k + 1}) ${esc(s.name)}${s.arrival ? ` (เวลานัด ${esc(s.arrival)})` : ''}${s.receiver ? ` &nbsp; ผู้รับ : ${esc(s.receiver)}` : ''}</p>${docs}</div>`).join('')}
    ${t.roundTrip ? `<div class="stop"><p>↩ กลับ ${esc(CFG.ORIGIN || 'SCM')} (รอบไป-กลับ) กด "รถกลับถึง ${esc(CFG.ORIGIN || 'SCM')}" ในหน้ากรอกข้อมูลเพื่อจบงาน</p></div>` : ''}
  </div></section>`;
}

// รายงานที่ 2 : คลังสินค้า (งานละครึ่งหน้า 2 งานต่อ 1 หน้า)
function whHalf(t) {
  return `<div class="wh">
    ${head('สำหรับคลังสินค้า', `อัปโหลดรูปส่งงานหลังรถออกจาก ${esc(CFG.ORIGIN || 'SCM')} ทันที`, t)}
    <div class="strong">${join([t.pickup ? 'ตารางเวลา ' + t.pickup + ' น.' : '', t.client, t.vehicleType, t.plate ? 'ทะเบียน ' + t.plate : '', t.driver ? 'ผู้ขับ ' + t.driver : ''])}</div>
    <div class="line">บริษัทขนส่ง : ${esc(t.company || '-')}</div>
    <div class="line">หมายเหตุ : ${esc(t.transport || '-')}</div>
    <div class="stops"><div>จุดส่ง</div>${(t.stops || []).map((s, k) => `<div class="line">${k + 1}) ${esc(s.name)}${s.arrival ? ` (${esc(s.arrival)})` : ''}</div>`).join('')}</div>
    <div class="qrrow">${qrBox('pickup.html', t, 'สแกนด้วยกล้องมือถือ')}${help('วิธีใช้', CFG.QR_HELP_LOADER)}</div>
  </div>`;
}

function draw() {
  const k = kind(); pending = []; let html = '', pages = 0;
  if (k !== 'wh') { html += tasks.map(driverPage).join(''); pages += tasks.length; }
  if (k !== 'driver') for (let i = 0; i < tasks.length; i += 2) { html += `<section class="page">${tasks.slice(i, i + 2).map(whHalf).join('')}</section>`; pages++; }
  $('pages').innerHTML = html;
  pending.forEach(([id, text]) => new QRCode($(id), { text, width: 360, height: 360, correctLevel: QRCode.CorrectLevel.M }));
  const name = { driver: 'รายงานคนขับ (1 งานต่อหน้า)', wh: 'รายงานคลังสินค้า (2 งานต่อหน้า)', both: 'ทั้ง 2 รายงาน' }[k];
  $('info').textContent = tasks.length ? `${tasks.length} งาน · ${name} · ${pages} หน้า A4 แนวตั้ง` : 'ไม่มีแผนจัดส่งของวันที่เลือก';
  $('printBtn').disabled = !tasks.length; $('printBtn').textContent = 'พิมพ์' + ({ driver: 'รายงานคนขับ', wh: 'รายงานคลังสินค้า', both: 'ทั้ง 2 รายงาน' }[k]);
}

async function load() {
  $('date').value = date; DateBox.sync($('date')); $('back').href = 'dashboard.html?date=' + date;
  $('info').textContent = 'กำลังโหลด…'; $('pages').innerHTML = ''; $('printBtn').disabled = true; tasks = [];
  try {
    if (!CFG.API_URL) tasks = [1, 2, 3].map(i => ({ taskCode: 'D20261003-0' + i, date: '2026-10-03', pickup: '07:30', client: 'LN26-552', company: 'บริษัท ปทุม ทรานสปอร์ต จำกัด', transport: 'min : 4W (โหมดตัวอย่าง)', plate: '3 ฒผ 2186', vehicleType: '4ล้อเทลเกต(จัมโบ้)', driver: 'กิตติศักดิ์ มะลิเลย', phone: '092-8322384', round: i === 2 ? 'ไป-กลับ' : 'รอบเดียว', roundTrip: i === 2,
      stops: [{ name: '7-11 พหลโยธิน 55/2 วงเวียนขางเขน #24145', arrival: '09:00', receiver: 'ติดต่อ 091-876-6497 คุณจ๋า' }, { name: '7-11 ลำลูกกา 36 #24267', arrival: '10:00', receiver: 'โปรดดูข้อมูลในใบแพลน' }, { name: '7-11 ลำลูกกา 51', arrival: '10:30', receiver: '' }].slice(0, 4 - i) }));
    else { const d = await Auth.getJson({ action: 'plan', date }); if (!d.ok) throw new Error(d.error); tasks = d.tasks; }
  } catch (e) { $('info').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message; return; }
  if (!window.QRCode) { $('info').textContent = 'โหลดตัวสร้าง QR ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วเปิดหน้านี้ใหม่'; return; }
  tasks.sort((a, b) => a.taskCode.localeCompare(b.taskCode));
  draw();
}
DateBox.attach($('date'));
$('date').onchange = e => { date = e.target.value || today(); load(); };
document.querySelectorAll('input[name=kind]').forEach(r => { r.onchange = draw; });
$('printBtn').onclick = () => window.print();
load();
</script>
</body>
</html>
