<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Route Plan - Delivery Tracking</title>
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1120">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0b1120;--panel:#131c2e;--panel2:#1a2540;--rule:#26324d;--text:#eaf0fa;--muted:#8e9bb3;--blue:#4aa8ff;--amber:#f6b93b;--green:#34d08c;--red:#ff4d61;--grey:#8e9bb3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px clamp(12px,2vw,36px);background:linear-gradient(180deg,#1b2742,#141d31);border-bottom:1px solid var(--rule)}
h1{margin:0;font-size:clamp(20px,2.2vw,30px)} h1 small{font-size:.5em;color:var(--muted);font-weight:500;margin-left:.4em}
.right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9em;color:var(--muted)}
a.nav,button,.dbx{font:inherit;color:var(--text);cursor:pointer;background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:.25em .8em;text-decoration:none}
a.nav:hover,button:hover,a.nav:focus-visible,button:focus-visible{border-color:var(--blue);outline:none}
button.on{background:var(--blue);color:#06101f;border-color:var(--blue);font-weight:700}
main{padding:10px clamp(12px,2vw,36px) 36px;max-width:1500px;margin:0 auto}
.muted{color:var(--muted)}.small{font-size:.86em}
#msg{font-weight:600;min-height:1.2em;color:var(--red)}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.days button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;line-height:1.2;padding:.3em .6em;min-width:62px;font-size:.84em}
.days button b{font-size:1.05em}
.days button span{color:var(--muted);font-size:.85em}
.days button.has span{color:var(--green);font-weight:700}
.days button.on span{color:#06101f}
.days button.today{border-color:#6b8fc7}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:2px 0 10px}
.kpi div{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:.35em .7em;border-left:4px solid var(--c,var(--rule))}
.kpi b{display:block;font-size:1.6em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.82em}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:10px}
@media (max-width:900px){.lay{grid-template-columns:1fr}}
.mapw{position:relative;border:1px solid var(--rule);border-radius:12px;overflow:hidden;height:min(72vh,700px);min-height:380px;background:#0f1729}
#map{position:absolute;inset:0}
.leaflet-container{font-family:inherit;background:#0f1729}
.legend{position:absolute;right:8px;top:8px;z-index:800;background:rgba(19,28,46,.92);border:1px solid var(--rule);border-radius:8px;padding:.3em .6em;font-size:.76em;line-height:1.6;max-width:260px}
.legend label{display:block;cursor:pointer}
@media (max-width:600px){.legend .lx{display:none}.legend{font-size:.72em}}
.side{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:8px;max-height:min(72vh,700px);overflow:auto}
.sidehd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 6px;font-size:.85em}
.sidehd .sp{flex:1}
.stk{position:sticky;top:-8px;z-index:5;background:var(--panel);margin:-8px -8px 6px;padding:8px 8px 2px;border-bottom:1px solid var(--rule)}
.qbox{position:relative;margin:0 0 6px}.qbox input{width:100%;font:inherit;font-size:.88em;color:var(--text);background:#0f1729;border:1px solid var(--rule);border-radius:8px;padding:.35em 2em .35em .7em}.qbox input:focus{outline:none;border-color:var(--blue)}.qbox button{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:0 .45em;line-height:1.4}

.tk{background:var(--panel2);border:1px solid var(--rule);border-left:5px solid var(--c);border-radius:9px;padding:.4em .6em;margin:0 0 6px;cursor:pointer}
.tk:hover,.tk:focus-visible{border-color:var(--blue);outline:none}
.tk.off{opacity:.45}
.tk.foc{box-shadow:0 0 0 2px var(--c)}
.tk .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tk .hd .tcode{font-size:1.05em;letter-spacing:.01em}
.tk .hd .cli{font-weight:700;color:#dbe7ff;background:rgba(255,255,255,.07);border:1px solid var(--rule);border-radius:6px;padding:0 .45em;font-size:.92em}
.tk .hd2{display:flex;flex-wrap:wrap;gap:0 14px;font-size:.8em;color:var(--muted);margin:.1em 0 .1em 1.4em}
.tk .hd2 b{color:#cbd5e1;font-weight:600}
.na2{color:#8e9bb3;font-style:italic;font-weight:400}

.tk .hd input{width:16px;height:16px;margin:0;cursor:pointer;accent-color:var(--c)}
.tk .hd b{font-variant-numeric:tabular-nums}
.tk .code{font-size:.82em;color:var(--muted);font-weight:600}
.tk .hd .tag{margin-left:auto}
.tk .sub{font-size:.8em;color:var(--muted)}
.tk ol{margin:.25em 0 0;padding:0;list-style:none;font-size:.82em}
.tk li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;padding:.18em 0;border-top:1px dashed var(--rule)}
.tk li .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:800;margin-top:2px}
.tk li .t{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tk li .lg{grid-column:2/4;color:var(--muted);font-size:.95em}
.tk li .warn{grid-column:2/4;color:var(--amber);font-weight:600}
.tk li .warn a{color:var(--blue)}
.tk .tot{font-size:.8em;color:#cbd5e1;margin-top:.2em}
.tag{display:inline-block;font-size:.76em;font-weight:700;padding:0 .55em;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tag.ok{color:var(--green)}.tag.risk{color:var(--amber)}.tag.na{color:var(--grey)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;border:1px solid rgba(255,255,255,.6)}
.pin{display:grid;place-items:center;border-radius:50%;border:2px solid #fff;color:#fff;font-weight:800;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.6);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pin.sq{border-radius:6px}
.vlab{color:#fff;border:1px solid rgba(255,255,255,.8);border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.leaflet-tooltip.slab{background:rgba(255,255,255,.92);color:#111;border:0;border-radius:4px;padding:1px 5px;font:600 11px/1.3 "Sarabun",sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.leaflet-tooltip.slab:before{display:none}
.empty{padding:1.2em;text-align:center;color:var(--muted)}
.note{font-size:.78em;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>Route Plan <small>วางแผนจัดส่งบนแผนที่</small></h1>
  <div class="right">
    <button id="prev" type="button" aria-label="วันก่อนหน้า">‹</button>
    <input id="date" type="date" class="dbx" aria-label="เลือกวันที่">
    <button id="next" type="button" aria-label="วันถัดไป">›</button>
    <button id="today" type="button">วันนี้</button>
    <button id="tmr" type="button">พรุ่งนี้</button>
    <button id="reload" type="button" title="โหลดข้อมูลใหม่">↻</button>
    <a class="nav" href="index.html">ปฏิทิน</a><a class="nav" id="dashLink" href="dashboard.html">Dashboard</a><a class="nav" href="gps.html">Summary</a><span id="userBox"></span>
  </div>
</header>
<main>
  <div id="msg" role="status"></div>
  <div class="days" id="days" aria-label="จำนวนงานแต่ละวัน"></div>
  <div class="kpi" id="kpi"></div>
  <div class="lay">
    <div class="mapw">
      <div id="map" aria-label="แผนที่แผนงาน"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="side">
      <div class="stk"><div class="sidehd"><b id="sideTitle">งานในวัน</b><span class="sp"></span><button id="allOn" type="button">แสดงทั้งหมด</button><button id="allOff" type="button">ซ่อนทั้งหมด</button></div><div class="qbox"><input id="q" type="text" placeholder="ค้นหา ทะเบียน / Task Code / Client / ชื่อจุดส่ง (หลายคำคั่นด้วย ,)" aria-label="ค้นหางาน" autocomplete="off"><button id="qx" type="button" hidden aria-label="ล้างคำค้นหา">×</button></div></div>
      <div id="list"></div>
      <div class="note">ระยะทาง/เวลาขับเป็นค่าประมาณ : ระยะเส้นตรง × ตัวคูณถนน (<span id="cDet">1.3</span>) ที่ความเร็วเฉลี่ย <span id="cSpd">45</span> กม./ชม. + ลงของจุดละ <span id="cUnl">20</span> นาที (ปรับได้ที่หน้า ETA) · เส้นบนแผนที่เป็นเส้นตรง ไม่ใช่เส้นทางถนนจริง</div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script src="route.js"></script>
</body>
</html>
