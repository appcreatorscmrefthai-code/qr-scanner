<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>อัปโหลดรูปส่งงาน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="form.css">
</head>
<body>
<div class="wrap">
  <h1>อัปโหลดรูปส่งงาน</h1>
  <p class="sub">ถ่ายรูปก่อนรถออกจากต้นทาง</p>
  <div id="demo" class="msg info" hidden>โหมดตัวอย่าง: ยังไม่ได้ใส่ API_URL ใน config.js ข้อมูลจะไม่ถูกบันทึก</div>
  <div id="msg" class="msg err" hidden role="alert"></div>

  <div id="formBox">
    <div class="card">
      <h2>1. งานที่ส่ง</h2>
      <div id="reader" hidden></div>
      <div id="taskBox" hidden></div>
      <button class="btn primary" id="scanBtn" type="button" hidden>เปิดกล้องสแกน QR ประจำงาน</button>
    </div>

    <div class="card">
      <h2>2. รูปส่งงาน <small>สูงสุด 20 รูป รวมไม่เกิน 50 MB</small></h2>
      <div id="pkPhotos"></div>
    </div>

    <div class="card">
      <h2><label for="note">3. หมายเหตุ</label></h2>
      <textarea id="note" maxlength="2000" placeholder="ถ้ามี"></textarea>
    </div>

    <div class="card stamp"><span>วันที่และเวลา (บันทึกอัตโนมัติ)</span><b id="stamp"></b></div>

    <div id="prog" hidden><div id="progText" class="meter"></div><div class="bar"><i id="progBar"></i></div><br></div>
    <div class="btns"><button class="btn primary" id="sendBtn" type="button" disabled>ส่งข้อมูล</button></div>
  </div>

  <div id="doneBox" class="card done" hidden>
    <div class="ok">✓</div><p id="doneText"></p>
  </div>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script src="form.js"></script>
<script>
const { $, esc } = DF;
let task = null, busy = false;
const picker = DF.makePicker({ key: 'photos', kind: 'pickup', el: 'pkPhotos', max: 20, maxMB: 50, label: 'รูปส่งงาน' });

async function load(code) {
  if (!code) return;
  DF.say('กำลังโหลดข้อมูลงาน…', 'info');
  try {
    task = (await DF.retry(() => DF.apiGet({ action: 'task', code }), 2)).task;
    $('taskBox').hidden = false; $('taskBox').innerHTML = DF.taskCard(task);
    $('scanBtn').hidden = true; $('sendBtn').disabled = false;
    DF.say('');
  } catch (e) {
    task = null; $('scanBtn').hidden = false; $('sendBtn').disabled = true;
    DF.say(e.message || 'ไม่พบงานนี้');
  }
}

$('sendBtn').onclick = async () => {
  if (busy || !task) return;
  DF.say('');
  if (!picker.items.length) return DF.say('กรุณาแนบรูปส่งงานอย่างน้อย 1 รูป');
  busy = true; $('sendBtn').disabled = true; picker.root.dataset.busy = '1';
  try {
    const ids = await DF.uploadAll(task.taskCode, [picker], 0, DF.progress);
    DF.progress(0, 0);
    const d = await DF.retry(() => DF.apiPost({ action: 'submit', form: 'pickup', taskCode: task.taskCode, note: $('note').value.trim(), photos: ids.photos }), 2);
    $('formBox').hidden = true; $('doneBox').hidden = false;
    $('doneText').innerHTML = `<b>${esc(task.taskCode)}</b><br>บันทึกรูปส่งงานเรียบร้อย<br><span style="color:var(--muted)">${DF.fmt(d.time)}</span>`;
    window.scrollTo(0, 0);
  } catch (e) {
    DF.say('ส่งข้อมูลไม่สำเร็จ: ' + (e.message || e) + ' กรุณากดส่งอีกครั้ง');
  } finally {
    busy = false; $('prog').hidden = true; $('sendBtn').disabled = !task; delete picker.root.dataset.busy;
  }
};

$('scanBtn').onclick = () => DF.startScan(load);
DF.clock();
if (DF.DEMO) $('demo').hidden = false;
if (DF.param('task')) load(DF.param('task')); else $('scanBtn').hidden = false;
</script>
</body>
</html>
