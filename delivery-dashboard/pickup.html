<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>อัปรูปส่งงาน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="form.css">
</head>
<body>
<div class="wrap">
  <h1>อัปรูปส่งงาน</h1>
  <p class="sub">ถ่ายรูปก่อนรถออกจากต้นทาง</p>
  <div id="demo" class="msg info" hidden>โหมดตัวอย่าง: ยังไม่ได้ใส่ API_URL ใน config.js ข้อมูลจะไม่ถูกบันทึก</div>
  <div id="msg" class="msg err" hidden role="alert"></div>

  <div id="formBox">
    <div class="card">
      <h2>1. สแกน QR Task Code</h2>
      <div id="reader" hidden></div>
      <button class="btn primary" id="scanBtn" type="button">เปิดกล้องสแกน QR</button>
      <div id="taskBox" hidden></div>
    </div>

    <div class="card">
      <h2>2. รูปส่งงาน <small>สูงสุด 20 รูป รวมไม่เกิน 50 MB</small></h2>
      <div id="pkPhotos"></div>
    </div>

    <div class="card">
      <h2><label for="note">3. หมายเหตุ</label></h2>
      <textarea id="note" maxlength="2000" placeholder="ถ้ามี"></textarea>
    </div>

    <div class="card stamp"><span>วันที่และเวลา (บันทึกอัตโนมัติ)</span><b id="stamp"></b></div>

    <div id="prog" hidden><div id="progText" class="meter"></div><div class="bar"><i id="progBar"></i></div><br></div>
    <div class="btns"><button class="btn primary" type="button" data-send="save">ส่งข้อมูล</button></div>
  </div>

  <div id="doneBox" class="card done" hidden>
    <div class="ok">✓</div><p id="doneText"></p>
    <button class="btn" id="again" type="button">ส่งงานถัดไป</button>
  </div>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script src="form.js"></script>
<script>
DeliveryForm.init({
  form: 'pickup',
  pickers: [{ key: 'photos', kind: 'pickup', el: 'pkPhotos', max: 20, maxMB: 50, label: 'รูปส่งงาน' }]
});
</script>
</body>
</html>
