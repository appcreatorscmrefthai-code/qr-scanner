<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Summary - Delivery Plan</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1120">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0b1120;--panel:#131c2e;--panel2:#1a2540;--rule:#26324d;--text:#eaf0fa;--muted:#8e9bb3;--blue:#4aa8ff;--amber:#f6b93b;--green:#34d08c;--red:#ff4d61;--grey:#8e9bb3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px clamp(12px,2vw,36px);background:linear-gradient(180deg,#1b2742,#141d31);border-bottom:1px solid var(--rule)}
h1{margin:0;font-size:clamp(20px,2.2vw,30px)} h2{font-size:1.1em;margin:0 0 .5em}
.right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9em;color:var(--muted)}
a.nav,button,.dbx,select{font:inherit;color:var(--text);cursor:pointer;background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:.25em .8em;text-decoration:none}
a.nav:hover,button:hover,a.nav:focus-visible,button:focus-visible,select:focus-visible{border-color:var(--blue);outline:none}
button.on{background:var(--blue);color:#06101f;border-color:var(--blue);font-weight:700}
main{padding:10px clamp(12px,2vw,36px) 36px;max-width:1500px;margin:0 auto}
.muted{color:var(--muted)}.small{font-size:.86em}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:4px 0 8px;font-size:.88em;color:var(--muted)}
.bar b{color:var(--text)}
.ban{border-radius:10px;padding:.5em .9em;margin:6px 0;font-weight:600;border:1px solid #7a5a12;background:#2a2210;color:var(--amber)}
.ban.bad{border-color:#8b2c38;background:#33121a;color:#ff8a98}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:6px 0 10px}
.kpi div{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:.35em .7em;border-left:4px solid var(--c,var(--rule))}
.kpi b{display:block;font-size:1.7em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.82em}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px}
@media (max-width:900px){.lay{grid-template-columns:1fr}}
.mapw{position:relative;border:1px solid var(--rule);border-radius:12px;overflow:hidden;height:min(68vh,640px);min-height:360px;background:#0f1729}
#map{position:absolute;inset:0}
.leaflet-container{font-family:inherit;background:#0f1729}
.det{position:absolute;left:10px;bottom:10px;z-index:900;width:min(360px,calc(100% - 20px));max-height:62%;overflow:auto;background:rgba(19,28,46,.97);border:1px solid var(--rule);border-radius:12px;padding:.6em .8em;box-shadow:0 6px 24px rgba(0,0,0,.5);font-size:.9em}
.det[hidden]{display:none}
.det h3{margin:0 0 .2em;font-size:1.05em}
.det .x{position:absolute;right:6px;top:4px;padding:0 .5em;font-size:1.1em}
.det .ln{display:flex;justify-content:space-between;gap:8px;padding:.12em 0;border-bottom:1px dashed var(--rule)}
.det .ln:last-child{border:0}
.legend{position:absolute;right:8px;top:8px;z-index:800;background:rgba(19,28,46,.9);border:1px solid var(--rule);border-radius:8px;padding:.3em .6em;font-size:.76em;line-height:1.6}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.side{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:8px;max-height:min(68vh,640px);overflow:auto}
.vi{display:block;width:100%;text-align:left;margin:0 0 6px;padding:.4em .6em;border-radius:9px;border-left:5px solid var(--c,var(--grey))}
.vi b{font-variant-numeric:tabular-nums}
.vi small{display:block;color:var(--muted)}
.tag{display:inline-block;font-size:.78em;font-weight:700;padding:0 .55em;border-radius:999px;border:1px solid currentColor;margin-left:4px;white-space:nowrap}
.tag.ok{color:var(--green)}.tag.risk{color:var(--amber)}.tag.late{color:#ff6b7c}.tag.na{color:var(--grey)}
.pin{display:grid;place-items:center;border-radius:50%;border:2px solid #fff;color:#06101f;font-weight:800;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.6)}
.pin.sq{border-radius:6px}
.veh{font-size:20px;line-height:1;filter:drop-shadow(0 1px 3px #000)}
.vlab{background:rgba(11,17,32,.88);color:#fff;border:1px solid var(--rule);border-radius:6px;padding:0 5px;font-size:11px;font-weight:700;white-space:nowrap}
section.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:12px clamp(10px,1.6vw,18px);margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:.9em;font-variant-numeric:tabular-nums}
th,td{padding:.3em .5em;border-bottom:1px solid var(--rule);text-align:left}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
.tw{overflow:auto;max-height:340px}
.num{text-align:right}
.tcw{overflow-x:auto;margin:8px 0 4px}
.tc{position:relative;display:flex;gap:4px;padding-left:40px;min-width:max-content}
.tc .grid{position:absolute;left:40px;right:0;top:20px;height:150px;pointer-events:none}
.tc .grid div{position:absolute;left:0;right:0;border-top:1px solid var(--rule)}
.tc .grid div.tg{border-top:1.5px dashed var(--green);opacity:.7}
.tc .ax{flex:0 0 40px;margin-left:-40px;position:sticky;left:0;z-index:2;height:170px;background:var(--panel)}
.tc .ax span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted)}
.tc .ax span.tg{color:var(--green)}
.tc .col{flex:1 0 26px;max-width:64px;display:flex;flex-direction:column;align-items:stretch;position:relative}
.tc .pa{height:170px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.tc .v{font-size:11px;font-weight:700;margin-bottom:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tc .bar{width:70%;min-height:2px;border-radius:4px 4px 0 0;background:var(--green)}
.tc .bar.mid{background:var(--amber)}.tc .bar.low{background:var(--red)}
.tc .none{font-size:11px;color:var(--muted);opacity:.5;margin-bottom:2px}
.tc .xl{font-size:11px;color:var(--muted);text-align:center;border-top:1px solid var(--muted);padding-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tc .xl small{display:block;font-size:10px;opacity:.8}
.tc .col.cur .xl{color:var(--text);font-weight:700}
.tleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8em;color:var(--muted)}
.tleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.empty{padding:1.2em;text-align:center;color:var(--muted)}
#msg{font-weight:600;min-height:1.4em;color:var(--red)}
</style>
</head>
<body>
<header>
  <h1>Summary</h1>
  <div class="right">
    <input id="date" type="date" class="dbx" aria-label="เลือกวันที่">
    <button id="today" type="button">วันนี้</button>
    <a class="nav" href="index.html">ปฏิทิน</a><a class="nav" href="dashboard.html">Dashboard</a><span id="userBox"></span>
  </div>
</header>
<main>
  <div id="msg" role="status"></div>
  <div id="ban"></div>
  <div class="bar" id="info"></div>
  <div class="kpi" id="kpi"></div>

  <div class="lay">
    <div class="mapw">
      <div id="map" aria-label="แผนที่ตำแหน่งรถ"></div>
      <div class="legend" id="legend"></div>
      <div class="det" id="det" hidden></div>
    </div>
    <div class="side" id="vlist" aria-label="รายการรถ"></div>
  </div>

  <section class="card" aria-labelledby="dt1">
    <h2 id="dt1">Delay Trend <span class="muted small">(เวลาถึงจริง เทียบเวลานัดของแต่ละจุด)</span></h2>
    <div class="bar">
      <button id="dtDay" class="on" type="button">รายวัน (30 วัน)</button><button id="dtMon" type="button">รายเดือน (12 เดือน)</button>
      <span id="dtNote"></span>
    </div>
    <div class="tcw"><div id="dtChart" class="tc" role="img" aria-label="กราฟเปอร์เซ็นต์ทันเวลา"></div></div>
    <div class="tleg"><span><i style="background:var(--green)"></i>ทันเวลา ≥ 90%</span><span><i style="background:var(--amber)"></i>70–89%</span><span><i style="background:var(--red)"></i>ต่ำกว่า 70%</span><span>- - - เป้าหมาย 90%</span><span>ตัวเลขใต้วันที่ = จำนวนจุดส่ง</span></div>
    <div class="tw"><table><thead><tr><th>ช่วง</th><th class="num">จุดส่ง</th><th class="num">ทันเวลา</th><th class="num">สาย</th><th class="num">% ทันเวลา</th><th class="num">สายเฉลี่ย (นาที)</th><th class="num">สายสุด (นาที)</th><th class="num">จาก GPS</th></tr></thead><tbody id="dtBody"></tbody></table></div>
  </section>

  <section class="card" aria-labelledby="gt1">
    <h2 id="gt1">ตำแหน่ง GPS ล่าสุดของรถ</h2>
    <div class="tw"><table><thead><tr><th>ทะเบียน</th><th>งาน</th><th>สถานะ GPS</th><th class="num">ความเร็ว</th><th>พิกัด</th><th>เวลา</th><th class="num">อายุ (นาที)</th></tr></thead><tbody id="gBody"></tbody></table></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script src="gps.js"></script>
</body>
</html>
