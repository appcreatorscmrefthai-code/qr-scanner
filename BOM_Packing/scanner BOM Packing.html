<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ค้นหา BOM Packing</title>
<meta name="theme-color" content="#1a5fb4">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BOM Packing">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1d2733; --muted: #6b7684;
    --line: #e2e6ea; --accent: #1a5fb4; --badge: #e8ebef; --err: #b42318; --on: #e8f0fb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans Thai", system-ui, sans-serif; font-size: 16px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card);
    border-bottom: 1px solid var(--line); padding: 10px 12px; }
  #form { display: flex; gap: 8px; max-width: 1000px; margin: 0 auto; }
  input { flex: 1; min-width: 0; padding: 10px 12px; font: inherit;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  button.ghost { background: #fff; color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 3px solid #8ab4f8; outline-offset: 1px; }

  /* หน้า Login: ซ่อนข้อมูลทั้งหมดจนกว่าจะเข้าสู่ระบบ */
  body:not(.authed) header,
  body:not(.authed) #reader-wrap,
  body:not(.authed) #app { display: none; }
  body.authed #login { display: none; }
  #login { max-width: 360px; margin: 10vh auto 0; padding: 0 16px; text-align: center; }
  #login img { width: 72px; height: 72px; }
  #login h1 { font-size: 22px; margin: 8px 0 16px; }
  #loginForm { text-align: left; }
  #loginForm label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  #loginForm input { display: block; width: 100%; margin-top: 4px; font-size: 16px; color: var(--ink); }
  #loginForm button { width: 100%; }
  #loginMsg { padding: 0 0 12px; text-align: left; }

  #reader-wrap { max-width: 1000px; margin: 12px auto 0; padding: 0 12px; }
  #reader { width: 100%; max-width: 480px; border-radius: 8px; overflow: hidden; background: #000; }
  #stop { margin-top: 8px; }

  /* ส่วนที่ 1 = รายการ FG (ซ้าย)  ส่วนที่ 2 = BOM Packing ของ FG (ขวา) */
  #app { max-width: 1000px; margin: 0 auto; padding: 12px; display: grid;
    grid-template-columns: 280px 1fr; gap: 12px; align-items: start; }
  #list { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    overflow-y: auto; max-height: calc(100vh - 92px); }
  .row { display: block; width: 100%; text-align: left; background: #fff; color: var(--ink);
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 10px 14px; }
  .row:last-child { border-bottom: 0; }
  .row b { display: block; font-weight: 600; }
  .row span { color: var(--muted); font-size: 14px; }
  .row.on { background: var(--on); box-shadow: inset 3px 0 0 var(--accent); }

  .msg { color: var(--muted); padding: 24px 12px; text-align: center; }
  .msg.err { color: var(--err); }
  .back { display: none; margin-bottom: 10px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .field + .field { margin-top: 12px; }
  .label { font-size: 13px; color: var(--muted); }
  .value { font-size: 22px; }
  .rel { display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; font-size: 14px; color: var(--muted); }
  .badge { background: var(--badge); color: var(--ink); border-radius: 6px; padding: 1px 8px; font-weight: 600; }
  .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 480px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; }

  @media (max-width: 719px) {
    #app { grid-template-columns: 1fr; }
    #list { max-height: none; }
    #app.has-detail #list { display: none; }
    #app:not(.has-detail) #detail { display: none; }
    .back { display: inline-block; }
  }
</style>
</head>
<body>

<div id="login">
  <img src="icon-192.png" alt="">
  <h1>BOM Packing</h1>
  <form id="loginForm" class="card">
    <label>อีเมล
      <input id="u" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </label>
    <label>รหัสผ่าน
      <input id="p" type="password" autocomplete="current-password" required>
    </label>
    <div id="loginMsg" class="msg err" hidden></div>
    <button type="submit" id="loginBtn">เข้าสู่ระบบ</button>
  </form>
</div>

<header>
  <form id="form">
    <input id="q" type="search" placeholder="สแกนหรือพิมพ์ FG code" autocomplete="off">
    <button type="button" id="scan" class="ghost">สแกน</button>
    <button type="submit">ค้นหา</button>
    <button type="button" id="logout" class="ghost">ออก</button>
  </form>
</header>

<div id="reader-wrap" hidden>
  <div id="reader"></div>
  <button type="button" id="stop" class="ghost">ยกเลิกสแกน</button>
</div>

<div id="app">
  <div id="list"><div class="msg">กำลังโหลดข้อมูล…</div></div>
  <section id="detail"><div class="msg">เลือก FG จากรายการเพื่อดู BOM Packing</div></section>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  const SUPABASE_URL = "https://vmpcfiefryvfovqjhewy.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ZizU3_OdW6cOrouQXo7JsA_cYCySG9H";

  const $ = (id) => document.getElementById(id);
  const q = $("q"), app = $("app"), listEl = $("list"), detail = $("detail"), wrap = $("reader-wrap");
  const DETAIL_HINT = "เลือก FG จากรายการเพื่อดู BOM Packing";
  const TOKEN_KEY = "bom_token";
  const REFRESH_KEY = "bom_refresh";

  let all = [];
  let bom = {};
  let ready = false;
  let pending = null;
  let selected = "";
  let scanner = null;
  let refreshTimer = null;

  const store = {
    get: (k) => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
    del: (k) => { try { localStorage.removeItem(k); } catch (e) {} },
  };
  let token = store.get(TOKEN_KEY);
  let refreshToken = store.get(REFRESH_KEY);

  const clean = (raw) => String(raw).split("::")[0].trim();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const msg = (t, err) => `<div class="msg${err ? " err" : ""}">${esc(t)}</div>`;

  // ---------- Login / Logout / Refresh (Supabase Auth) ----------
  const setAuthed = (on) => document.body.classList.toggle("authed", on);

  function showLoginMsg(text) {
    const m = $("loginMsg");
    m.textContent = text;
    m.hidden = !text;
  }

  async function authFetch(path, body) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, data };
  }

  function applySession(data) {
    token = data.access_token;
    refreshToken = data.refresh_token;
    store.set(TOKEN_KEY, token);
    store.set(REFRESH_KEY, refreshToken);
    scheduleRefresh(data.expires_in || 3600);
  }

  function scheduleRefresh(expiresInSec) {
    if (refreshTimer) clearTimeout(refreshTimer);
    const ms = Math.max((expiresInSec - 60) * 1000, 10000); // รีเฟรชก่อนหมดอายุ 60 วิ
    refreshTimer = setTimeout(doRefresh, ms);
  }

  async function doRefresh() {
    if (!refreshToken) return;
    const { ok, data } = await authFetch("token?grant_type=refresh_token", { refresh_token: refreshToken });
    if (ok) {
      applySession(data);
    } else {
      logout("หมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่");
    }
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("loginBtn");
    btn.disabled = true;
    btn.textContent = "กำลังตรวจสอบ…";
    showLoginMsg("");
    try {
      const email = $("u").value.trim();
      const { ok, data } = await authFetch("token?grant_type=password", { email, password: $("p").value });
      if (!ok) {
        showLoginMsg("เข้าสู่ระบบไม่ได้ (ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง)");
      } else {
        applySession(data);
        $("p").value = "";
        setAuthed(true);
        loadAll();
      }
    } catch (err) {
      showLoginMsg("เชื่อมต่อไม่ได้: " + err.message);
    }
    btn.disabled = false;
    btn.textContent = "เข้าสู่ระบบ";
  });

  async function logout(message) {
    const old = token;
    if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
    token = ""; refreshToken = "";
    store.del(TOKEN_KEY); store.del(REFRESH_KEY);
    await stopScan();
    all = []; bom = {}; ready = false; pending = null; selected = "";
    q.value = "";
    app.classList.remove("has-detail");
    listEl.innerHTML = msg("กำลังโหลดข้อมูล…");
    detail.innerHTML = msg(DETAIL_HINT);
    setAuthed(false);
    showLoginMsg(message || "");
    if (old) fetch(`${SUPABASE_URL}/auth/v1/logout`, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${old}` },
    }).catch(() => {});
  }

  $("logout").addEventListener("click", () => logout(""));

  // ---------- โหลดข้อมูลทั้งหมดแบบแบ่งหน้า (PostgREST จำกัดสูงสุด 1000 แถว/request) ----------
  const PAGE_SIZE = 1000;
  async function fetchAllRows(path, headers, onUnauthorized) {
    let out = [];
    let from = 0;
    for (;;) {
      let res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        headers: { ...headers, Range: `${from}-${from + PAGE_SIZE - 1}` },
      });
      if (res.status === 401) {
        const newHeaders = await onUnauthorized();
        if (!newHeaders) return null; // logout ไปแล้ว
        headers = newHeaders;
        res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
          headers: { ...headers, Range: `${from}-${from + PAGE_SIZE - 1}` },
        });
      }
      if (!res.ok) throw new Error(`โหลด ${path} ไม่ได้ (HTTP ${res.status})`);
      const rows = await res.json();
      out = out.concat(rows);
      if (rows.length < PAGE_SIZE) break; // หน้าสุดท้ายแล้ว
      from += PAGE_SIZE;
    }
    return out;
  }

  // ---------- โหลดข้อมูลทั้งหมด (จาก Supabase, ต้อง login ก่อน) ----------
  async function loadAll(attempt = 1) {
    try {
      const baseHeaders = () => ({ apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}` });
      const onUnauthorized = async () => {
        if (!refreshToken) { logout("หมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่"); return null; }
        await doRefresh();
        if (!token) return null; // doRefresh ล้มเหลวและ logout ไปแล้ว
        return baseHeaders();
      };

      const [fgRows, useRows] = await Promise.all([
        fetchAllRows("bom_packing?select=no,col_b,col_c&order=no", baseHeaders(), onUnauthorized),
        fetchAllRows("bom_packing_use?select=col_b,col_d,col_e,col_f,col_g&order=no", baseHeaders(), onUnauthorized),
      ]);
      if (fgRows === null || useRows === null) return; // logout ไปแล้วระหว่างทาง

      all = fgRows.map((r) => ({ code: r.col_b, line: r.no, model: r.col_c }));

      bom = {};
      for (const r of useRows) {
        const key = String(r.col_b).toUpperCase();
        (bom[key] ||= []).push([r.col_d, r.col_e, r.col_f, r.col_g]);
      }

      ready = true;
      renderList();
      if (pending !== null) { const p = pending; pending = null; search(p); }
    } catch (err) {
      if (attempt < 2) return setTimeout(() => loadAll(2), 1500);
      listEl.innerHTML = msg("โหลดข้อมูลไม่ได้: " + err.message, true) +
        `<div class="msg"><button type="button" id="retry">ลองใหม่</button></div>`;
    }
  }

  // ---------- ส่วนที่ 1: รายการ FG ----------
  function renderList() {
    const k = clean(q.value).toUpperCase();
    const rows = all.filter((r) => !k || (r.code + " " + r.model).toUpperCase().includes(k));
    listEl.innerHTML = rows.length
      ? rows.map((r) => `
          <button type="button" class="row${r.code === selected ? " on" : ""}" data-code="${esc(r.code)}">
            <b>${esc(r.code)}</b><span>${esc(r.model)}</span>
          </button>`).join("")
      : msg("ไม่พบรายการ");
    const on = listEl.querySelector(".on");
    if (on) on.scrollIntoView({ block: "nearest" });
  }

  listEl.addEventListener("click", (e) => {
    if (e.target.id === "retry") { listEl.innerHTML = msg("กำลังโหลดข้อมูล…"); return loadAll(); }
    const b = e.target.closest(".row");
    if (b) select(b.dataset.code);
  });

  // ---------- ส่วนที่ 2: BOM Packing ของ FG (แสดงเมื่อเลือกจากส่วนที่ 1) ----------
  function select(code) {
    selected = code;
    renderList();
    app.classList.add("has-detail");
    renderDetail(code);
  }

  function renderDetail(code) {
    const back = `<button type="button" id="back" class="ghost back">‹ กลับไปรายการ</button>`;
    const fg = all.find((r) => r.code === code);
    if (!fg) return (detail.innerHTML = back + msg(`ไม่พบ FG code: ${code}`, true));
    const items = bom[code.toUpperCase()] || [];

    const rows = items.map(([no, name, unit, qty]) => `
      <tr>
        <td>${esc(no)}</td>
        <td>${esc(name)}</td>
        <td>${esc(unit)}</td>
        <td class="num">${esc(qty)}</td>
      </tr>`).join("");

    detail.innerHTML = back + `
      <div class="card">
        <div class="field"><div class="label">FG code</div><div class="value">${esc(fg.code)}</div></div>
        <div class="field"><div class="label">Line</div><div class="value">${esc(fg.line)}</div></div>
        <div class="field"><div class="label">FG Model</div><div class="value">${esc(fg.model)}</div></div>
      </div>
      <div class="rel">Related BOM_Packing_Uses <span class="badge">${items.length}</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Item Number</th><th>Product Name</th><th>Unit</th><th class="num">Use Qty</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="4" class="msg">ไม่มีรายการ BOM</td></tr>`}</tbody>
        </table>
      </div>`;
  }

  detail.addEventListener("click", (e) => {
    if (e.target.id === "back") app.classList.remove("has-detail");
  });

  // ---------- ค้นหา / สแกน ----------
  function search(raw) {
    if (!ready) { pending = raw; q.value = clean(raw); return; }
    const code = clean(raw);
    q.value = code;
    renderList();
    if (!code) return;
    const key = code.toUpperCase();
    const hit = all.find((r) => r.code.toUpperCase() === key);
    if (hit) return select(hit.code);
    const only = all.filter((r) => (r.code + " " + r.model).toUpperCase().includes(key));
    if (only.length === 1) select(only[0].code);
  }

  async function startScan() {
    if (scanner) return;
    wrap.hidden = false;
    scanner = new Html5Qrcode("reader", { experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
    try {
      await scanner.start({ facingMode: "environment" }, { fps: 10 }, onScan, () => {});
    } catch (err) {
      await stopScan();
      listEl.innerHTML = msg("เปิดกล้องไม่ได้ ตรวจสิทธิ์กล้องของเบราว์เซอร์", true);
    }
  }

  async function stopScan() {
    if (!scanner) return;
    const s = scanner;
    scanner = null;
    try { await s.stop(); s.clear(); } catch (e) {}
    wrap.hidden = true;
  }

  function onScan(text) {
    if (!scanner) return;
    if (navigator.vibrate) navigator.vibrate(80);
    stopScan();
    search(text);
  }

  $("scan").addEventListener("click", startScan);
  $("stop").addEventListener("click", stopScan);
  $("form").addEventListener("submit", (e) => { e.preventDefault(); search(q.value); });
  q.addEventListener("input", renderList);

  if (token) { setAuthed(true); scheduleRefresh(3000); loadAll(); } else { setAuthed(false); }
</script>
</body>
</html>
